[package]
name = "uquery"
version = "0.8.0"
edition = "2024"

[features]
default = ["cli"]
# Dependencies of the `uquery` binary, not needed to use the library.
cli = ["dep:clap", "dep:tracing-subscriber", "dep:async-trait", "dep:pingora", "dep:self_update"]

[[bin]]
name = "uquery"
required-features = ["cli"]
# Same name as the library: document only the library.
doc = false

[dependencies]
axum = { version = "0.8" }
tokio = {version="1.47",features = ["full"] }
tokio-util = { version = "*",features = ["io","io-util"] }
serde = { version = "1.0", features = ["derive"] }
duckdb = { version = "=1.20000.1", features = ["extensions-full"] }
arrow = { version = "60", features = ["arrow-json","arrow-csv","ipc_compression","chrono-tz"] }
serde_json = "1.0"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip","cors"]}
clap = { version = "4.5", features = ["derive","env"], optional = true }
async-trait = { version = "0.1.88", optional = true }
pingora = { version = "0.8.0", features=["proxy"], optional = true }
getrandom = "0.3"
subtle = "2.6"
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "progress-bar", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"], optional = true }

[dev-dependencies]
polars = { version = "0.55"}
polars-io = { version = "0.55",features = ["ipc_streaming","json"]}

[profile.release]
strip = true
lto = true
