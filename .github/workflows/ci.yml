name: uQuery CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches:
      - main
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Cache rustc and C/C++ (bundled DuckDB) compilations in the GitHub Actions
  # cache: unlike rust-cache, entries survive Cargo.lock changes.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy

      # rust-cache deletes the files but keeps the directories of DuckDB's unpacked
      # sources; libduckdb-sys then fails to unpack over the empty tree.
      - name: Remove DuckDB sources emptied by rust-cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources

      - name: Run fmt
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      # Checks the library as its users build it, without the `cli` feature.
      - name: Run clippy on the library alone
        run: cargo clippy --lib --no-default-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      # rust-cache deletes the files but keeps the directories of DuckDB's unpacked
      # sources; libduckdb-sys then fails to unpack over the empty tree.
      - name: Remove DuckDB sources emptied by rust-cache
        shell: bash
        run: rm -rf target/duckdb-sources target/*/duckdb-sources

      - name: Run tests
        run: cargo test --verbose